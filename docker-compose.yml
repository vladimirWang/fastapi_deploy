services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6000:6000"
    env_file:
      - ./.env.prod
    # postgres 在 ../docker_infrastracture 独立 compose 中，跨项目无法用 depends_on；
    # 启动顺序由 start-prod.sh 等待 shared-postgres 健康后再 up。
    networks:
      - private_chef_network

networks:
  private_chef_network:
    name: private_chef_network
    external: true
