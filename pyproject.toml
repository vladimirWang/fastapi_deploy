[project]
name = "demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles==25.1.0",
    "alembic==1.18.3",
    "fastapi[all]==0.128.2",
    "pydantic>=2.11.4",
    "redis==7.1.0",
    "SQLAlchemy[asyncio]==2.0.46",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.48.0",
]

# 配置双索引源：优先清华镜像源，其次官方 PyPI
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
name = "tsinghua"
default = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
name = "pypi"
